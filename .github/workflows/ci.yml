      - run: python3 tests/deploy_schema.py
      - run: python3 tests/deploy_executor.py
      - run: php tests/deploy_db.php
      - run: php tests/invoice_unit.php
      - run: python3 tests/invoice_schema.py
      - run: php tests/invoice_db.php
      - run: php tests/accounting_unit.php
      - run: python3 tests/accounting_schema.py
      - run: php tests/accounting_db.php
      - run: php tests/bank_closing_unit.php
      - run: python3 -B tests/bank_closing_schema.py
      - run: php tests/bank_unit.php
      - run: python3 tests/bank_schema.py
      - run: php tests/bank_db.php
      - run: python3 tests/economics_schema.py
      - run: php tests/economics_db.php
      - run: php tests/financial_books_unit.php
      - run: python3 -B tests/financial_books_schema.py
      - run: php tests/financial_books_db.php
      - run: php tests/freelance_unit.php
      - run: python3 -B tests/freelance_schema.py
      - run: php tests/freelance_db.php
      - run: php tests/capacity_unit.php
      - run: python3 -B tests/capacity_schema.py
      - run: php tests/capacity_db.php
      - run: php tests/project_management_unit.php
      - run: python3 -B tests/project_management_schema.py
      - run: php tests/project_management_db.php
      - run: php tests/portfolio_unit.php
      - run: python3 -B tests/portfolio_schema.py
      - run: php tests/portfolio_db.php
      - run: php tests/tax_unit.php
      - run: php tests/jurisdiction_unit.php
      - run: python3 -B tests/jurisdiction_schema.py
      - run: python3 tests/tax_schema.py
      - run: php tests/tax_db.php
      - run: php tests/contract_controls_unit.php
      - run: python3 -B tests/contract_controls_schema.py
      - run: python3 tests/contracts_schema.py
      - run: php tests/contracts_db.php
      - run: php tests/preparation_unit.php
      - run: python3 tests/preparation_schema.py
      - run: php tests/preparation_db.php
      - run: php tests/signing_unit.php
      - run: python3 tests/signing_schema.py
      - run: php tests/signing_db.php
      - run: python3 tests/retention_schema.py
      - run: php tests/retention_db.php
      - run: python3 tests/engine_schema.py
      - run: php tests/engine_db.php
      - run: python3 tests/book_schema.py
      - run: php tests/book_db.php
      - run: python3 tests/forum_schema.py
      - run: php tests/forum_db.php
      - run: python3 tests/editorial_schema.py
      - run: php tests/editorial_capabilities_unit.php
      - run: php tests/editorial_db.php
      - run: python3 tests/logs_schema.py
      - run: php tests/logs_db.php
      - run: php tests/bots_support_unit.php
      - run: python3 tests/bots_support_schema.py
      - run: python3 tests/bots_schema.py
      - run: php tests/bots_db.php
      - run: python3 tests/incidents_schema.py
      - run: php tests/service_ops_unit.php
      - run: python3 -B tests/service_ops_schema.py
      - run: php tests/service_ops_db.php
      - run: php tests/incidents_db.php
      - run: python3 tests/reliability_schema.py
      - run: php tests/reliability_db.php
      - run: python3 tests/discovery_schema.py
      - run: php tests/discovery_db.php
      - if: matrix.php == '8.4'
        uses: actions/checkout@v4
        with:
          repository: CajeerTeam/CajeerLogs
          ref: ec686ab677149de5472e207c3aa6a1f6f9392a75
          path: .ci-logs
          persist-credentials: false
      - if: matrix.php == '8.4'
        run: php tests/logs_wire.php .ci-logs
      - run: python3 tests/lite_schema.py
      - uses: actions/checkout@v4
        with:
          repository: CajeerTeam/CajeerEngineLite
          ref: c6a52cbbe4fe123dacdf19b1cfd4ed9b15e0a587
          path: .ci-lite
          persist-credentials: false
      - run: WORKSPACE_LITE_TEST_SOURCE="$GITHUB_WORKSPACE/.ci-lite" php tests/lite_db.php
  package:
    needs: [verify, postgres, bots-compatibility, recovery-postgres, release-rehearsal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/release.py build --output dist
      - run: python3 tools/release.py verify "dist/CajeerWorkspace-$(cat VERSION).zip"
      - uses: actions/upload-artifact@v4
        with:
          name: CajeerWorkspace-unsigned-candidate
          path: dist/*
          if-no-files-found: error

  postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['14', '16']
        suite: ['tenant', 'permissions', 'auth', 'identity', 'auth_acceptance', 'planning', 'workload', 'clients', 'oss', 'github', 'project_release', 'infra', 'deploy', 'invoice', 'accounting', 'bank', 'economics', 'portfolio', 'capacity', 'freelance', 'financial_books', 'project_management', 'tax', 'contracts', 'preparation', 'signing', 'retention', 'engine', 'book', 'forum', 'lite', 'editorial', 'logs', 'bots', 'incidents', 'service_ops', 'discovery', 'reliability', 'assistant', 'assistant_draft', 'assistant_ops', 'delivery', 'team_lead', 'release_trace']
    services:
      db:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: workspace
          POSTGRES_USER: workspace
          POSTGRES_PASSWORD: ci-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workspace -d workspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: workspace
      PGUSER: workspace
      PGPASSWORD: ci-disposable-password
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_pgsql, curl, openssl
          coverage: none
      - if: matrix.suite == 'tenant' || matrix.suite == 'permissions'
        run: python3 tests/${{ matrix.suite }}_e2e.py --postgres
      - if: matrix.suite == 'auth'
        run: php tests/auth_db.php --postgres
      - if: matrix.suite == 'identity'
        run: php tests/identity_db.php --postgres
      - if: matrix.suite == 'auth_acceptance'
        run: php tests/auth_acceptance_db.php --postgres
      - if: matrix.suite == 'planning'
        run: php tests/planning_db.php --postgres
      - if: matrix.suite == 'workload'
        run: php tests/workload_db.php --postgres
      - if: matrix.suite == 'clients'
        run: php tests/clients_db.php --postgres
      - if: matrix.suite == 'oss'
        run: php tests/oss_db.php --postgres
      - if: matrix.suite == 'github'
        run: php tests/github_db.php --postgres
      - if: matrix.suite == 'team_lead'
        run: php tests/team_lead_db.php --postgres
      - if: matrix.suite == 'delivery'
        run: php tests/delivery_db.php --postgres
      - name: Release trace PostgreSQL transfer
        if: matrix.suite == 'release_trace'
        run: php tests/release_trace_db.php --postgres
      - if: matrix.suite == 'project_release'
        run: php tests/project_release_db.php --postgres
      - if: matrix.suite == 'infra'
        run: php tests/infra_db.php --postgres
      - if: matrix.suite == 'deploy'
        run: php tests/deploy_db.php --postgres

      - if: matrix.suite == 'invoice'
        run: php tests/invoice_db.php --postgres

      - if: matrix.suite == 'accounting'
        run: php tests/accounting_db.php --postgres
      - if: matrix.suite == 'bank'
        run: php tests/bank_db.php --postgres

      - if: matrix.suite == 'economics'
        run: php tests/economics_db.php --postgres
      - if: matrix.suite == 'portfolio'
        run: php tests/portfolio_db.php --postgres
      - if: matrix.suite == 'financial_books'
        run: php tests/financial_books_db.php --postgres
      - if: matrix.suite == 'freelance'
        run: php tests/freelance_db.php --postgres
      - if: matrix.suite == 'capacity'
        run: php tests/capacity_db.php --postgres
      - if: matrix.suite == 'project_management'
        run: php tests/project_management_db.php --postgres
      - if: matrix.suite == 'tax'
        run: php tests/tax_db.php --postgres

      - if: matrix.suite == 'contracts'
        run: php tests/contracts_db.php --postgres
      - if: matrix.suite == 'preparation'
        run: php tests/preparation_db.php --postgres
      - if: matrix.suite == 'signing'
        run: php tests/signing_db.php --postgres
      - if: matrix.suite == 'retention'
        run: php tests/retention_db.php --postgres
      - if: matrix.suite == 'engine'
        run: php tests/engine_db.php --postgres
      - if: matrix.suite == 'book'
        run: php tests/book_db.php --postgres
      - if: matrix.suite == 'forum'
        run: php tests/forum_db.php --postgres
      - if: matrix.suite == 'editorial'
        run: php tests/editorial_db.php --postgres
      - if: matrix.suite == 'logs'
        run: php tests/logs_db.php --postgres
      - if: matrix.suite == 'bots'
        run: php tests/bots_db.php --postgres
      - if: matrix.suite == 'incidents'
        run: php tests/incidents_db.php --postgres
      - if: matrix.suite == 'service_ops'
        run: php tests/service_ops_db.php --postgres
      - if: matrix.suite == 'reliability'
        run: php tests/reliability_db.php --postgres
      - if: matrix.suite == 'assistant'
        run: php tests/assistant_db.php --postgres
      - if: matrix.suite == 'assistant_draft'
        run: php tests/assistant_draft_db.php --postgres
      - if: matrix.suite == 'assistant_ops'
        run: php tests/assistant_ops_db.php --postgres
      - if: matrix.suite == 'discovery'
        run: php tests/discovery_db.php --postgres
      - if: matrix.suite == 'lite'
        uses: actions/checkout@v4
        with:
          repository: CajeerTeam/CajeerEngineLite
          ref: c6a52cbbe4fe123dacdf19b1cfd4ed9b15e0a587
          path: .ci-lite
          persist-credentials: false
      - if: matrix.suite == 'lite'
        run: WORKSPACE_LITE_TEST_SOURCE="$GITHUB_WORKSPACE/.ci-lite" php tests/lite_db.php --postgres
  bots-compatibility:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/cajeerbots?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CajeerTeam/CajeerBots
          ref: f1366da1c548b124af379b139f381dbc3ab165e6
          path: .ci-bots
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --global pnpm@9.15.9
      - working-directory: .ci-bots
        run: |
          git apply --check ../integrations/cajeerbots-1.0.2-workspace.patch
          git apply ../integrations/cajeerbots-1.0.2-workspace.patch
          pnpm install --frozen-lockfile
          pnpm build
          pnpm typecheck
          pnpm exec vitest run packages/db/src/workspace-delivery.spec.ts apps/api/src/modules/bot-runtime/workspace-delivery.spec.ts apps/worker/src/workers/workspace-delivery.spec.ts

  recovery-postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: workspace_recovery_src
          POSTGRES_USER: workspace
          POSTGRES_PASSWORD: ci-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workspace -d workspace_recovery_src"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: workspace_recovery_src
      PGUSER: workspace
      PGPASSWORD: ci-disposable-password
      PGSSLMODE: disable
      WORKSPACE_RECOVERY_CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, curl, openssl
          coverage: none
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: PATH="/usr/lib/postgresql/16/bin:$PATH" python3 tests/recovery_pg.py '${{ job.services.db.id }}'
      - run: PATH="/usr/lib/postgresql/16/bin:$PATH" WORKSPACE_UPDATE_TEST_PG=1 python3 -B tests/update_install.py InstallTests.test_postgres_install

  release-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, curl, openssl
          coverage: none
      - name: Build actual predecessor and rehearse candidate switch
        shell: bash
        run: |
          set -euo pipefail
          previous=''
          while IFS= read -r commit; do
            if [[ "$(git show "$commit:VERSION" 2>/dev/null || true)" == '1.8.0' ]]; then
              previous="$commit"
              break
            fi
          done < <(git log --first-parent --format=%H HEAD)
          if [[ -z "$previous" ]]; then
            echo 'Actual 1.8.0 predecessor missing from Git history; release gate blocked.' >&2
            exit 1
          fi
          # Use the last first-parent release ancestor, not an unrelated branch or a version-edited candidate.
          git merge-base --is-ancestor "$previous" HEAD
          mkdir -m 700 "$RUNNER_TEMP/previous-source"
          git archive "$previous" | tar -x -C "$RUNNER_TEMP/previous-source"
          python3 "$RUNNER_TEMP/previous-source/tools/release.py" build --output "$RUNNER_TEMP/previous-dist"
          export WORKSPACE_PREVIOUS_RELEASE="$RUNNER_TEMP/previous-dist/CajeerWorkspace-1.8.0.zip"
          WORKSPACE_CANDIDATE_REQUIRE_NATIVE=1 python3 tests/candidate.py
          python3 -B tests/update_install.py InstallTests.test_install_finish InstallTests.test_scheduler_uses_real_installer
          python3 tests/production.py
