name: PHP Workspace
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, curl
          coverage: none
      - run: find app public views tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php -l bin/workspace
      - run: php tests/run.php
      - run: python3 tests/web_e2e.py
