name: PHP Workspace
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, curl, openssl
          coverage: none
      - run: find app public views tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php -l bin/workspace
      - run: php bin/workspace doctor
      - run: php tests/workspace_updates.php
      - run: php tests/assistant_unit.php
      - run: php tests/assistant_db.php
      - run: php tests/assistant_draft_unit.php
      - run: php tests/assistant_draft_db.php
      - run: php tests/assistant_ops_unit.php
      - run: php tests/assistant_ops_db.php
      - run: python3 -B tests/update_package.py
      - run: python3 -B tests/update_install.py
      - run: python3 -B tests/update_schedule.py
      - run: php tests/integration_profiles.php
      - run: php tests/full_cycle_unit.php
      - run: php tests/pilot_db.php
      - run: python3 tests/recovery.py
      - run: php tests/recovery_db.php
      - run: python3 tests/recovery_http.py
      - run: php tests/run.php
      - run: python3 tests/web_e2e.py
      - run: php tests/migrations.php
      - run: python3 tests/release.py
      - run: php tests/candidate_unit.php
      - run: python3 tests/candidate.py
      - run: python3 tests/production.py
      - run: python3 tests/tenant_schema.py
      - run: python3 tests/tenant_e2e.py
      - run: php tests/auth_security.php
      - run: php tests/auth_policy.php
      - run: python3 tests/auth_policy_e2e.py
      - run: python3 tests/auth_schema.py
      - run: python3 tests/identity_schema.py
      - run: php tests/identity_db.php
      - run: php tests/auth_acceptance.php
      - run: php tests/auth_acceptance_db.php
      - run: python3 tests/auth_acceptance_schema.py
      - run: python3 tests/identity_e2e.py
      - run: php tests/auth_db.php
      - run: python3 tests/auth_e2e.py
      - run: php tests/permissions_roles.php
      - run: python3 tests/permissions_schema.py
      - run: python3 tests/permissions_e2e.py
      - run: php tests/planning_unit.php
      - run: python3 tests/planning_schema.py
      - run: php tests/planning_db.php
      - run: python3 tests/planning_e2e.py
      - run: php tests/workload_unit.php
      - run: python3 tests/workload_schema.py
      - run: php tests/workload_db.php
      - run: python3 tests/workload_e2e.py
      - run: python3 tests/clients_schema.py
      - run: php tests/clients_db.php
      - run: python3 tests/clients_e2e.py
      - run: python3 tests/oss_schema.py
      - run: php tests/oss_maintenance_unit.php
      - run: python3 -B tests/oss_maintenance_schema.py
      - run: php tests/oss_db.php
      - run: python3 tests/oss_e2e.py
      - run: php tests/github_unit.php
      - run: python3 tests/github_schema.py
      - run: php tests/github_db.php
      - run: python3 tests/github_e2e.py
      - run: php tests/project_release_unit.php
      - run: python3 tests/project_release_schema.py
      - run: php tests/project_release_db.php
      - run: python3 -B tests/delivery_schema.py
      - run: php tests/release_trace_unit.php
      - run: php tests/release_trace_db.php
      - run: php tests/delivery_unit.php
